<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拍摄策划 · Shoot Plan</title>
<meta name="description" content="拍摄主题、服装、风格、道具与分镜编排，支持按景别 / 方向 / 角度 / 焦距 / 构图 / 光位 / 道具自动编排，可一键生成长图。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231b1916'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23f4f1ea' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23b1583a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="topbar" id="topbar">
  <a class="brand" href="#" id="brand" title="回到顶部">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="16" r="4.2" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">拍摄策划</span>
    <span class="brand-sub">SHOOT&nbsp;PLAN</span>
  </a>

  <div class="top-actions">
    <span class="save-state" id="saveState">已保存</span>
    <button class="btn ghost only-wide" id="btnNew">新建</button>
    <button class="btn ghost only-wide" id="btnHelp">说明</button>
    <button class="btn ghost" id="btnExport">导出长图</button>
    <button class="btn primary" id="btnWizard">AI 自动策划</button>
    <button class="btn icon" id="btnSettings" title="模型与图源设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/></svg>
    </button>
  </div>
</header>

<main class="plan" id="plan">
  <section class="cover" id="cover">
    <div class="cover-kicker">
      <span class="no">01</span>
      <span>开篇 / OVERVIEW</span>
      <i></i>
      <span id="planMeta">—</span>
    </div>

    <h1 class="theme" id="fTheme" contenteditable="true" spellcheck="false" data-ph="点击输入拍摄主题"></h1>
    <p class="concept" id="fConcept" contenteditable="true" spellcheck="false" data-ph="一句话说清这次拍摄的气质与叙事……"></p>

    <div class="meta" id="metaGrid">
      <div class="meta-item span2">
        <div class="meta-k">服装期望 <em>WARDROBE</em></div>
        <div class="meta-v chips" id="fCostume"></div>
      </div>
      <div class="meta-item">
        <div class="meta-k">时间 <em>TIME</em></div>
        <div class="meta-v text-line" id="fTime" contenteditable="true" spellcheck="false" data-ph="日期 / 时段 / 天气"></div>
      </div>
      <div class="meta-item">
        <div class="meta-k">地点 <em>LOCATION</em></div>
        <div class="meta-v text-line" id="fLocation" contenteditable="true" spellcheck="false" data-ph="场景与机位说明"></div>
      </div>
      <div class="meta-item span2">
        <div class="meta-k">风格形式 <em>STYLE</em></div>
        <div class="meta-v chips" id="fStyle"></div>
      </div>
      <div class="meta-item span2">
        <div class="meta-k">道具 <em>PROPS</em></div>
        <div class="meta-v chips" id="fProps"></div>
      </div>
    </div>
  </section>

  <section class="shots" id="shots">
    <div class="sec-head">
      <div class="sec-no">02</div>
      <h2>分镜脚本</h2>
      <div class="sec-line"></div>
      <div class="sec-count"><b id="shotCount">0</b><span>张</span></div>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="toolbar-row">
        <span class="tb-label">编排</span>
        <div class="dims" id="dims" role="tablist"></div>
        <div class="tb-spacer"></div>
        <div class="menu-wrap" id="addWrap">
          <button class="btn tiny ghost" id="btnAdd">＋ 添加图片</button>
          <div class="menu" id="addMenu" hidden>
            <button type="button" data-act="local">从本地选择图片</button>
            <button type="button" data-act="xhs">从小红书链接导入</button>
          </div>
        </div>
      </div>
      <div class="values" id="values" hidden></div>
    </div>

    <div id="grid" class="grid-wrap"></div>
  </section>

  <footer class="foot">
    <div class="foot-line"></div>
    <div class="foot-row">
      <span>拍摄策划 · <span id="footTheme">未命名</span></span>
      <span id="footDate"></span>
    </div>
  </footer>
</main>

<div id="modalRoot"></div>
<div id="wizardRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script type="module" src="/js/app.js"></script>
<noscript><p style="padding:40px;font-family:sans-serif">请启用 JavaScript 以使用拍摄策划。</p></noscript>
</body>
</html>
